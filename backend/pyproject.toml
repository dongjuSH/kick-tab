[project]
name = "kicktab-backend"
version = "0.1.0"
description = "KickTab API server (FastAPI)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.1",
    "apscheduler==3.11.3",
    "fastapi[standard]>=0.162.0",
    "google-genai==2.34.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.16.2",
    "sqlalchemy==2.1.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".python-runtime"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
